<svg width="420" height="812" viewBox="0 0 420 812" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="420" height="812" fill="#0F0F11"/>

  <!-- ── Header bar (h=66) ── -->
  <!-- Green checkmark circle -->
  <defs>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#32D9B9"/>
      <stop offset="100%" stop-color="#09CA3E"/>
    </linearGradient>
  </defs>
  <circle cx="36" cy="33" r="22" fill="url(#greenGrad)"/>
  <circle cx="36" cy="33" r="10" fill="#fff"/>
  <path d="M41.275 29.535a1.63 1.63 0 0 0-2.05 0l-.123.111-4.523 4.521-1.68-1.681-.124-.111a1.63 1.63 0 0 0-2.05 0l-.123.111a1.63 1.63 0 0 0 0 2.298l2.83 2.829a1.62 1.62 0 0 0 2.296 0l5.67-5.67.006-.005.005-.004a1.63 1.63 0 0 0 .102-2.163l-.113-.125z" fill="#09CA3E"/>

  <!-- Title (left-aligned, next to checkmark) -->
  <text x="68" y="30" font-family="SF Pro Display, -apple-system, sans-serif" font-weight="700" font-size="17" fill="#D3D4D6">Вы записаны!</text>
  <text x="68" y="48" font-family="SF Pro Display, -apple-system, sans-serif" font-size="13" fill="#7D7D7F">Не опаздывайте</text>

  <!-- Close button (right, rounded square with X — from Done.svg) -->
  <path stroke="#D3D4D6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m389.17 24.83 5.66-5.66m0 5.66-5.66-5.66M389 32h6c5 0 7-2 7-7v-6c0-5-2-7-7-7H389c-5 0-7 2-7 7v6c0 5 2 7 7 7" fill="none"/>

  <!-- ── Card 1: Master (y=74) ── -->
  <rect x="16" y="74" width="388" height="72" rx="14" fill="#1C1C1E"/>
  <!-- Avatar -->
  <circle cx="52" cy="110" r="22" fill="#2C2C2E"/>
  <text x="52" y="116" text-anchor="middle" font-size="18">&#x1F464;</text>
  <!-- Name -->
  <text x="82" y="104" font-family="SF Pro Display, -apple-system, sans-serif" font-weight="600" font-size="15" fill="#D3D4D6">Валерия Жданова</text>
  <text x="82" y="122" font-family="SF Pro Display, -apple-system, sans-serif" font-size="13" fill="#8E8E93">Ногтевой сервис</text>
  <!-- Rating -->
  <!-- Rating star + number -->
  <path fill="#F0AF2D" d="M352.153 103.34l1.174 2.347c.16.326.586.64.946.7l2.127.353c1.36.227 1.68 1.213.7 2.187l-1.653 1.653c-.28.28-.434.82-.347 1.207l.473 2.046c.374 1.62-.486 2.247-1.92 1.4l-1.993-1.18c-.36-.213-.953-.213-1.32 0l-1.993 1.18c-1.427.847-2.294.214-1.92-1.4l.473-2.046c.087-.387-.067-.927-.347-1.207l-1.653-1.653c-.973-.974-.66-1.96.7-2.187l2.127-.353c.353-.06.78-.374.94-.7l1.173-2.347c.64-1.273 1.68-1.273 2.313 0"/>
  <text x="370" y="115" text-anchor="start" font-family="SF Pro Display, -apple-system, sans-serif" font-weight="500" font-size="13" fill="#7D7D7F">4.8</text>

  <!-- ── Card 2: Service (y=156) ── -->
  <rect x="16" y="156" width="388" height="100" rx="14" fill="#1C1C1E"/>
  <text x="30" y="180" font-family="SF Pro Display, -apple-system, sans-serif" font-weight="600" font-size="15" fill="#D3D4D6">Маникюр с покрытием</text>
  <text x="30" y="200" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" fill="#8E8E93">Аппаратный маникюр + выравнивание</text>
  <text x="30" y="218" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" fill="#8E8E93">базой + покрытие гель-лаком</text>
  <!-- Price + payment badge on same line -->
  <text x="30" y="242" font-family="SF Pro Display, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#D3D4D6">2 500 &#8381;</text>
  <text x="100" y="242" font-family="SF Pro Display, -apple-system, sans-serif" font-size="13" fill="#8E8E93" text-decoration="line-through">3 000 &#8381;</text>
  <rect x="304" y="231" width="86" height="22" rx="6" fill="#CE4259" fill-opacity="0.3"/>
  <text x="347" y="246" text-anchor="middle" font-family="SF Pro Display, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#CE4259">Не оплачено</text>

  <!-- ── Card 3: Date (y=266) ── -->
  <rect x="16" y="266" width="388" height="62" rx="14" fill="#1C1C1E"/>
  <text x="32" y="293" font-family="SF Pro Display, -apple-system, sans-serif" font-weight="600" font-size="15" fill="#D3D4D6">15 апреля, вторник</text>
  <text x="32" y="314" font-family="SF Pro Display, -apple-system, sans-serif" font-size="13" fill="#8E8E93">Дата</text>

  <!-- ── Card 4: Time (y=338) ── -->
  <rect x="16" y="338" width="388" height="62" rx="14" fill="#1C1C1E"/>
  <text x="32" y="365" font-family="SF Pro Display, -apple-system, sans-serif" font-weight="600" font-size="15" fill="#D3D4D6">14:00</text>
  <text x="32" y="386" font-family="SF Pro Display, -apple-system, sans-serif" font-size="13" fill="#8E8E93">Напомним за 1 час</text>


  <!-- ── 4 Action Buttons (from Done.svg: y=708, 91.25×60, rx=18, gap ~9px) ── -->
  <!-- Button 1: Поделиться (open link icon) -->
  <rect width="91.25" height="60" x="14" y="640" fill="#25262b" rx="18"/>
  <path stroke="#007afe" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m60.625 669 8.2-8.2m.8 4V660h-4.8m-6.2 0h-2c-5 0-7 2-7 7v6c0 5 2 7 7 7h6c5 0 7-2 7-7v-2"/>

  <!-- Button 2: Изменить (edit icon, disabled) -->
  <rect width="91.25" height="60" x="114.25" y="640" fill="#25262b" rx="18" opacity="0.4"/>
  <g opacity="0.4">
    <path stroke="#007afe" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="2" d="m161.135 661.6-8.21 8.69c-.31.33-.61.98-.67 1.43l-.37 3.24c-.13 1.17.71 1.97 1.87 1.77l3.22-.55c.45-.08 1.08-.41 1.39-.75l8.21-8.69c1.42-1.5 2.06-3.21-.15-5.3-2.2-2.07-3.87-1.34-5.29.16"/>
    <path stroke="#007afe" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="2" d="M159.765 663.05a6.126 6.126 0 0 0 5.45 5.15m-14.34 11.8h18"/>
  </g>

  <!-- Button 3: Чат (chat icon) -->
  <rect width="91.25" height="60" x="214.5" y="640" fill="#25262b" rx="18"/>
  <path stroke="#007afe" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="2" d="M256.625 677h-.5c-4 0-6-1-6-6v-5q0-6 6-6h8q6 0 6 6v5q0 6-6 6h-.5c-.31 0-.61.15-.8.4l-1.5 2c-.66.88-1.74.88-2.4 0l-1.5-2c-.16-.22-.53-.4-.8-.4"/>
  <path stroke="#007afe" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M255.125 666h10m-10 5h6"/>

  <!-- Button 4: Отменить (red X circle) -->
  <rect width="91.25" height="60" x="314.75" y="640" fill="#25262b" rx="18"/>
  <path stroke="#ce4259" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M360.375 680c5.5 0 10-4.5 10-10s-4.5-10-10-10-10 4.5-10 10 4.5 10 10 10m-2.83-7.17 5.66-5.66m0 5.66-5.66-5.66"/>

  <!-- ── Big Close Button (from Done.svg: 392×60, rx=20, #007afe) ── -->
  <rect x="14" y="716" width="392" height="60" rx="20" fill="#007afe"/>
  <!-- Icon + text group centered (icon 20px wide + 8 gap + ~60px text ≈ 88px → start at 210-44=166) -->
  <g transform="translate(166, 734)">
    <!-- Diamond tool icon (24×24) -->
    <path stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="2" d="m3.93 14.88 11.95-11.95m-4.78 14.35 1.2-1.2m1.49-1.49 2.39-2.39"/>
    <path stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m3.6 9.24 6.64-6.64c2.12-2.12 3.18-2.13 5.28-.03l4.91 4.91c2.1 2.1 2.09 3.16-.03 5.28l-6.64 6.64c-2.12 2.12-3.18 2.13-5.28.03l-4.91-4.91c-2.1-2.1-2.1-3.15.03-5.28M2 21h20"/>
    <!-- Text -->
    <text x="32" y="17" font-family="SF Pro Display, -apple-system, sans-serif" font-weight="600" font-size="17" fill="white">Закрыть</text>
  </g>
</svg>
