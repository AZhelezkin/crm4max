name: Mini App quality (manual, non-blocking)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: miniapp-quality-pr-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  authorize:
    name: Verify operator and PR
    runs-on: ubuntu-latest

    steps:
      - name: Allow only sld0Ant and an open PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ "${GITHUB_ACTOR,,}" != "sld0ant" ]]; then
            echo "Only sld0Ant may run this workflow" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "Run this workflow from the master branch" >&2
            exit 1
          fi
          state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.state')"
          if [[ "$state" != "open" ]]; then
            echo "PR #${PR_NUMBER} is not open" >&2
            exit 1
          fi

  quality:
    name: Typecheck, coverage and build
    needs: authorize
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: master-app

    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/merge

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: master-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        id: quality_gate
        continue-on-error: true
        run: npm run test:ci

      - name: Record non-blocking result
        if: always()
        env:
          RESULT: ${{ steps.quality_gate.outcome }}
        run: echo "### Quality gate — ${RESULT:-not-run} (non-blocking)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miniapp-coverage-pr-${{ inputs.pr_number }}-${{ github.run_id }}
          path: master-app/coverage
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Chromium browser smoke
    needs: [authorize, quality]
    if: ${{ always() && needs.authorize.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: master-app

    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/merge

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: master-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('master-app/package-lock.json') }}

      - name: Install Chromium and system dependencies
        run: npm run test:e2e:install -- --with-deps

      - name: Run browser smoke
        id: browser_smoke
        continue-on-error: true
        env:
          VITE_API_URL: ''
        run: npm run test:e2e

      - name: Record non-blocking result
        if: always()
        env:
          RESULT: ${{ steps.browser_smoke.outcome }}
        run: echo "### Chromium smoke — ${RESULT:-not-run} (non-blocking)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright failure diagnostics
        if: ${{ always() && steps.browser_smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: miniapp-playwright-failure-pr-${{ inputs.pr_number }}-${{ github.run_id }}
          path: |
            master-app/playwright-report
            master-app/test-results
          if-no-files-found: ignore
          retention-days: 7
