name: Mini App quality

on:
  pull_request:
    paths:
      - 'master-app/**'
      - '.github/workflows/**'
  push:
    branches: [master]
    paths:
      - 'master-app/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miniapp-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, coverage and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: master-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: master-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run test:ci

      - name: Upload coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miniapp-coverage-${{ github.run_id }}
          path: master-app/coverage
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Chromium browser smoke
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: master-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: master-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('master-app/package-lock.json') }}

      - name: Install Chromium and system dependencies
        run: npm run test:e2e:install -- --with-deps

      - name: Run browser smoke
        env:
          VITE_API_URL: ''
        run: npm run test:e2e

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: miniapp-playwright-failure-${{ github.run_id }}
          path: |
            master-app/playwright-report
            master-app/test-results
          if-no-files-found: ignore
          retention-days: 7
