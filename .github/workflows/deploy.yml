name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:  # ручной запуск из GitHub UI

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to Yandex Cloud
    runs-on: ubuntu-latest
    needs: test  # деплой только если тесты прошли

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Configure YC CLI
        run: |
          yc config set token ${{ secrets.YC_TOKEN }}
          yc config set cloud-id ${{ secrets.YC_CLOUD_ID }}
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}

      - name: Login to Yandex Container Registry
        run: |
          yc iam create-token | docker login \
            --username iam \
            --password-stdin \
            cr.yandex

      - name: Build and push Docker image
        env:
          IMAGE: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/crm4max-backend
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          docker build -t $IMAGE:$TAG -t $IMAGE:latest ./backend
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            # Авторизация Docker на VM
            yc iam create-token | docker login \
              --username iam \
              --password-stdin \
              cr.yandex

            IMAGE="cr.yandex/${{ secrets.YC_REGISTRY_ID }}/crm4max-backend"
            TAG="${{ steps.vars.outputs.tag }}"

            docker pull $IMAGE:$TAG

            cd /opt/crm4max
            IMAGE_TAG=$TAG YC_REGISTRY_ID=${{ secrets.YC_REGISTRY_ID }} \
              docker compose up -d --no-deps backend

            docker image prune -f

            sleep 5
            curl -sf http://localhost:3000/health \
              && echo "✅ Деплой успешен (tag: $TAG)" \
              || (echo "❌ Health check провалился" && exit 1)

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Деплой упал на коммите ${{ steps.vars.outputs.tag }}"
