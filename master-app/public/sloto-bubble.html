<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLOTO — Bubble Logo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #020b1a;
    background-image:
      radial-gradient(ellipse 80% 60% at 50% 50%, rgba(20, 50, 100, 0.5) 0%, transparent 70%),
      radial-gradient(ellipse 50% 40% at 50% 48%, rgba(30, 60, 120, 0.35) 0%, transparent 60%),
      radial-gradient(ellipse 120% 100% at 50% 50%, #081428 0%, #020810 100%);
    overflow: hidden;
  }

  /* SVG filter for refraction */
  .svg-filters { position: absolute; width: 0; height: 0; }

  .scene {
    position: relative;
    user-select: none;
  }

  /* Base text layer */
  .text-layer {
    display: flex;
    align-items: baseline;
    white-space: nowrap;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 800;
    font-size: 72px;
    letter-spacing: 2px;
  }

  .char {
    color: #ffffff;
    text-shadow: 0 0 15px rgba(255,255,255,0.1);
  }

  .sep {
    color: rgba(255,255,255,0.3);
    font-weight: 300;
    font-size: 48px;
    margin: 0 4px;
    align-self: center;
  }

  /* Red dot fixed at last O */
  .red-dot {
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #ff5555, #cc2233);
    box-shadow: 0 0 6px rgba(255,50,50, 0.5), inset 0 -2px 3px rgba(0,0,0,0.25);
    z-index: 10;
    pointer-events: none;
  }

  /* Bubble container — moves left/right */
  .bubble-container {
    position: absolute;
    top: 50%;
    width: 120px;
    height: 120px;
    margin-top: -60px;
    margin-left: -60px;
    pointer-events: none;
    z-index: 5;
  }

  /* Refracted text inside bubble (clipped circle) */
  .refract-clip {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
    /* Dark bg hides the normal text underneath — only distorted version shows */
    background: radial-gradient(circle,
      #071020 0%,
      #050d1c 60%,
      #030a18 100%
    );
  }

  .refract-text {
    position: absolute;
    display: flex;
    align-items: baseline;
    white-space: nowrap;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 800;
    font-size: 72px;
    letter-spacing: 2px;
    color: #ffffff;
    text-shadow: 0 0 15px rgba(255,255,255,0.1);
    filter: url(#refract-filter);
    transform-origin: center center;
    /* Magnification — lens effect */
    transform: scale(1.15);
  }

  .refract-text .sep {
    color: rgba(255,255,255, 0.3);
    font-weight: 300;
    font-size: 48px;
    margin: 0 4px;
  }

  /* Bubble visuals */
  .bubble-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255, 0.13);
    background: radial-gradient(
      ellipse at 30% 30%,
      rgba(255,255,255, 0.1) 0%,
      rgba(255,255,255, 0.03) 40%,
      transparent 65%
    );
    box-shadow:
      inset 0 0 25px rgba(255,255,255, 0.04),
      inset -4px -4px 15px rgba(100,150,255, 0.04),
      0 0 35px rgba(100,160,255, 0.07);
  }

  .bubble-iridescence {
    position: absolute;
    inset: 2px;
    border-radius: 50%;
    background: conic-gradient(
      from 180deg,
      rgba(255,100,100, 0.05),
      rgba(100,100,255, 0.07),
      rgba(100,255,200, 0.05),
      rgba(255,200,100, 0.04),
      rgba(255,100,100, 0.05)
    );
    animation: iridesceRotate 8s linear infinite;
    mix-blend-mode: screen;
  }

  @keyframes iridesceRotate {
    0%   { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .bubble-highlight {
    position: absolute;
    width: 32px;
    height: 18px;
    top: 14px;
    left: 18px;
    border-radius: 50%;
    background: radial-gradient(ellipse,
      rgba(255,255,255, 0.65) 0%,
      rgba(255,255,255, 0.15) 50%,
      transparent 100%
    );
    transform: rotate(-20deg);
    animation: hlPulse 3s ease-in-out infinite;
  }

  .bubble-highlight-sm {
    position: absolute;
    width: 10px;
    height: 7px;
    top: 36px;
    left: 14px;
    border-radius: 50%;
    background: rgba(255,255,255, 0.3);
    filter: blur(1px);
  }

  @keyframes hlPulse {
    0%, 100% { opacity: 0.9; }
    50%      { opacity: 0.55; }
  }

  /* Floating particles */
  .particle {
    position: fixed;
    border-radius: 50%;
    background: rgba(255,255,255, 0.12);
    animation: particleFloat linear infinite;
  }

  @keyframes particleFloat {
    0%   { transform: translateY(100vh) scale(0); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(-20vh) scale(1); opacity: 0; }
  }

  /* Glow under logo */
  .glow {
    position: absolute;
    bottom: -35px;
    left: 50%;
    transform: translateX(-50%);
    width: 350px;
    height: 50px;
    background: radial-gradient(ellipse, rgba(80,130,255,0.08) 0%, transparent 70%);
    filter: blur(18px);
    animation: glowPulse 3s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%, 100% { opacity: 0.5; }
    50%      { opacity: 1; }
  }
</style>
</head>
<body>

<!-- SVG filter for water-like refraction -->
<svg class="svg-filters" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="refract-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence id="turbulence" type="fractalNoise" baseFrequency="0.02 0.015" numOctaves="3" seed="3" result="noise">
        <animate attributeName="seed" from="1" to="100" dur="8s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div class="scene">
  <!-- Normal text -->
  <div class="text-layer" id="textLayer">
    <span class="char">s</span>
    <span class="sep">-</span>
    <span class="char">l</span>
    <span class="sep">-</span>
    <span class="char">o</span>
    <span class="sep">-</span>
    <span class="char">t</span>
    <span class="sep">-</span>
    <span class="char">o</span>
  </div>

  <!-- Red dot on last O -->
  <div class="red-dot" id="redDot"></div>

  <!-- Moving bubble -->
  <div class="bubble-container" id="bubble">
    <!-- Clipped refracted duplicate text -->
    <div class="refract-clip">
      <div class="refract-text" id="refractText">
        <span class="char">s</span>
        <span class="sep">-</span>
        <span class="char">l</span>
        <span class="sep">-</span>
        <span class="char">o</span>
        <span class="sep">-</span>
        <span class="char">t</span>
        <span class="sep">-</span>
        <span class="char">o</span>
      </div>
    </div>
    <!-- Bubble visuals on top -->
    <div class="bubble-ring"></div>
    <div class="bubble-iridescence"></div>
    <div class="bubble-highlight"></div>
    <div class="bubble-highlight-sm"></div>
  </div>

  <div class="glow"></div>
</div>

<script>
  const textLayer = document.getElementById('textLayer');
  const bubble = document.getElementById('bubble');
  const refractText = document.getElementById('refractText');
  const redDot = document.getElementById('redDot');
  const scene = document.querySelector('.scene');

  // Position red dot over last "o"
  function positionRedDot() {
    const chars = textLayer.querySelectorAll('.char');
    const lastO = chars[chars.length - 1];
    const sceneRect = scene.getBoundingClientRect();
    const oRect = lastO.getBoundingClientRect();

    redDot.style.left = (oRect.right - sceneRect.left - 8) + 'px';
    redDot.style.top = (oRect.top - sceneRect.top - 4) + 'px';
  }

  // Bubble animation
  const BUBBLE_SIZE = 120;
  let textWidth = 0;
  let startX = 0;
  let endX = 0;
  let textOffsetY = 0;
  let textOffsetX = 0;

  function measure() {
    const sceneRect = scene.getBoundingClientRect();
    const textRect = textLayer.getBoundingClientRect();
    textWidth = textRect.width;
    textOffsetX = textRect.left - sceneRect.left;
    textOffsetY = textRect.top - sceneRect.top;

    // Bubble center travels from right edge to left edge
    startX = textOffsetX + textWidth + BUBBLE_SIZE * 0.3;
    endX = textOffsetX - BUBBLE_SIZE * 0.3;

    positionRedDot();
  }

  // Ease in-out
  function easeInOut(t) {
    return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
  }

  // Ping-pong: 0→1→0 over full cycle
  const CYCLE_DURATION = 6000; // ms for one full pass (end→start→end)

  function animate(time) {
    const t = (time % CYCLE_DURATION) / CYCLE_DURATION;
    // Ping-pong: 0→1 first half, 1→0 second half
    const ping = t < 0.5 ? t * 2 : 2 - t * 2;
    const eased = easeInOut(ping);

    // Bubble X position (right to left to right)
    const bubbleX = startX + (endX - startX) * eased;

    bubble.style.left = bubbleX + 'px';

    // Slight vertical wobble
    const wobbleY = Math.sin(time * 0.002) * 3;
    const centerY = textOffsetY + textLayer.offsetHeight / 2;
    bubble.style.top = (centerY + wobbleY) + 'px';

    // Offset refracted text so it aligns with the base text behind the bubble
    const refX = -(bubbleX - textOffsetX) + BUBBLE_SIZE / 2;
    const refY = -(centerY + wobbleY - textOffsetY) + BUBBLE_SIZE / 2;
    refractText.style.left = refX + 'px';
    refractText.style.top = refY + 'px';

    requestAnimationFrame(animate);
  }

  // Particles
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.animationDuration = (7 + Math.random() * 10) + 's';
    p.style.animationDelay = (Math.random() * 8) + 's';
    const size = (2 + Math.random() * 3) + 'px';
    p.style.width = size;
    p.style.height = size;
    p.style.opacity = (0.04 + Math.random() * 0.12).toString();
    document.body.appendChild(p);
  }

  // Init
  window.addEventListener('resize', measure);
  measure();
  requestAnimationFrame(animate);
</script>
</body>
</html>
