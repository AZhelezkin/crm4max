<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLOTO — Bubble Logo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #020b1a;
    background-image:
      radial-gradient(ellipse 80% 60% at 50% 50%, rgba(20, 50, 100, 0.5) 0%, transparent 70%),
      radial-gradient(ellipse 50% 40% at 50% 48%, rgba(30, 60, 120, 0.35) 0%, transparent 60%),
      radial-gradient(ellipse 120% 100% at 50% 50%, #081428 0%, #020810 100%);
    overflow: hidden;
    font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
  }

  .logo-container {
    position: relative;
    display: flex;
    align-items: center;
    gap: 0;
    user-select: none;
  }

  .letter {
    font-size: 96px;
    font-weight: 900;
    color: #ffffff;
    text-transform: lowercase;
    opacity: 0;
    animation: letterIn 0.6s ease-out forwards;
    text-shadow: 0 0 20px rgba(255,255,255,0.15);
  }

  .separator {
    font-size: 96px;
    font-weight: 900;
    color: rgba(255,255,255,0.35);
    margin: 0 2px;
    opacity: 0;
    animation: letterIn 0.4s ease-out forwards;
  }

  .letter:nth-child(1)  { animation-delay: 0.1s; }
  .letter:nth-child(2)  { animation-delay: 0.3s; } /* separator */
  .letter:nth-child(3)  { animation-delay: 0.5s; }
  .letter:nth-child(4)  { animation-delay: 0.7s; } /* separator */
  .letter:nth-child(5)  { animation-delay: 0.9s; }
  .letter:nth-child(6)  { animation-delay: 1.1s; } /* separator */
  .letter:nth-child(7)  { animation-delay: 1.3s; }
  .letter:nth-child(8)  { animation-delay: 1.5s; } /* separator */

  @keyframes letterIn {
    0%   { opacity: 0; transform: translateY(20px) scale(0.8); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* === Bubble letter "o" === */
  .bubble-wrapper {
    position: relative;
    width: 96px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: bubbleIn 1s ease-out 1.8s forwards;
  }

  @keyframes bubbleIn {
    0%   { opacity: 0; transform: scale(0.2); }
    50%  { opacity: 1; transform: scale(1.15); }
    70%  { transform: scale(0.95); }
    100% { opacity: 1; transform: scale(1); }
  }

  .bubble-letter {
    position: absolute;
    font-size: 96px;
    font-weight: 900;
    color: rgba(255,255,255, 0.5);
    z-index: 1;
    filter: blur(0.5px);
    /* distortion effect via CSS */
    animation: letterDistort 4s ease-in-out infinite;
  }

  @keyframes letterDistort {
    0%, 100% { transform: scale(1, 1); }
    25%      { transform: scale(1.03, 0.97); }
    50%      { transform: scale(0.97, 1.03); }
    75%      { transform: scale(1.02, 0.98); }
  }

  .bubble {
    position: absolute;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    z-index: 2;
    animation: bubbleFloat 4s ease-in-out infinite;
  }

  @keyframes bubbleFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    33%      { transform: translateY(-4px) rotate(1deg); }
    66%      { transform: translateY(2px) rotate(-1deg); }
  }

  /* Bubble layers */
  .bubble-glass {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(
      ellipse at 30% 30%,
      rgba(255,255,255, 0.12) 0%,
      rgba(255,255,255, 0.04) 40%,
      rgba(255,255,255, 0.01) 60%,
      transparent 70%
    );
    border: 1.5px solid rgba(255,255,255, 0.12);
    box-shadow:
      inset 0 0 30px rgba(255,255,255, 0.05),
      inset -5px -5px 20px rgba(100,150,255, 0.05),
      0 0 40px rgba(100,150,255, 0.08);
    backdrop-filter: blur(0.5px);
  }

  /* Rainbow iridescence */
  .bubble-iridescence {
    position: absolute;
    inset: 2px;
    border-radius: 50%;
    background: conic-gradient(
      from 180deg,
      rgba(255,100,100, 0.06),
      rgba(100,100,255, 0.08),
      rgba(100,255,200, 0.06),
      rgba(255,200,100, 0.05),
      rgba(255,100,100, 0.06)
    );
    animation: iridesceRotate 8s linear infinite;
    mix-blend-mode: screen;
  }

  @keyframes iridesceRotate {
    0%   { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Top highlight */
  .bubble-highlight {
    position: absolute;
    width: 35px;
    height: 20px;
    top: 14px;
    left: 20px;
    border-radius: 50%;
    background: radial-gradient(
      ellipse,
      rgba(255,255,255, 0.7) 0%,
      rgba(255,255,255, 0.2) 50%,
      transparent 100%
    );
    transform: rotate(-20deg);
    animation: highlightPulse 3s ease-in-out infinite;
  }

  @keyframes highlightPulse {
    0%, 100% { opacity: 0.9; }
    50%      { opacity: 0.6; }
  }

  /* Small highlight */
  .bubble-highlight-sm {
    position: absolute;
    width: 12px;
    height: 8px;
    top: 38px;
    left: 16px;
    border-radius: 50%;
    background: rgba(255,255,255, 0.35);
    filter: blur(1px);
  }

  /* Red dot / valve */
  .bubble-dot {
    position: absolute;
    width: 14px;
    height: 14px;
    top: 8px;
    right: 14px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #ff5555, #cc2233);
    box-shadow: 0 0 6px rgba(255,50,50, 0.4), inset 0 -2px 3px rgba(0,0,0,0.2);
    z-index: 3;
    animation: dotPulse 2s ease-in-out infinite;
  }

  @keyframes dotPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.1); }
  }

  /* Bottom reflection */
  .bubble-bottom-ref {
    position: absolute;
    width: 50px;
    height: 25px;
    bottom: 12px;
    right: 15px;
    border-radius: 50%;
    background: radial-gradient(
      ellipse,
      rgba(150,200,255, 0.08) 0%,
      transparent 70%
    );
  }

  /* Ambient floating particles */
  .particle {
    position: fixed;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(255,255,255, 0.15);
    animation: particleFloat linear infinite;
  }

  @keyframes particleFloat {
    0%   { transform: translateY(100vh) scale(0); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(-20vh) scale(1); opacity: 0; }
  }

  /* Subtle glow under logo */
  .glow {
    position: absolute;
    bottom: -40px;
    left: 50%;
    transform: translateX(-50%);
    width: 400px;
    height: 60px;
    background: radial-gradient(ellipse, rgba(80,130,255,0.1) 0%, transparent 70%);
    filter: blur(20px);
    animation: glowPulse 3s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%, 100% { opacity: 0.5; }
    50%      { opacity: 1; }
  }
</style>
</head>
<body>

<div class="logo-container">
  <span class="letter">s</span>
  <span class="letter separator">-</span>
  <span class="letter">l</span>
  <span class="letter separator">-</span>
  <span class="letter">o</span>
  <span class="letter separator">-</span>
  <span class="letter">t</span>
  <span class="letter separator">-</span>

  <div class="bubble-wrapper">
    <span class="bubble-letter">o</span>
    <div class="bubble">
      <div class="bubble-glass"></div>
      <div class="bubble-iridescence"></div>
      <div class="bubble-highlight"></div>
      <div class="bubble-highlight-sm"></div>
      <div class="bubble-bottom-ref"></div>
    </div>
    <div class="bubble-dot"></div>
  </div>

  <div class="glow"></div>
</div>

<script>
  // Create ambient particles
  const body = document.body;
  for (let i = 0; i < 15; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.animationDuration = (6 + Math.random() * 10) + 's';
    p.style.animationDelay = (Math.random() * 8) + 's';
    p.style.width = p.style.height = (2 + Math.random() * 3) + 'px';
    p.style.opacity = (0.05 + Math.random() * 0.15).toString();
    body.appendChild(p);
  }
</script>
</body>
</html>
