<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#17181C" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F2F3F5" media="(prefers-color-scheme: light)" />
    <title>CRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" />
    <script>
      (function () {
        try {
          var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)')
          var apply = function () { document.documentElement.dataset.theme = mq && mq.matches ? 'light' : 'dark' }
          apply()
          if (mq && mq.addEventListener) mq.addEventListener('change', apply)
        } catch (e) {}
      })()
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/telegram-bootstrap.ts"></script>
  </body>
</html>
