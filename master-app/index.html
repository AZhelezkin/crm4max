<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="color-scheme" content="light dark" />
    <!--
      theme-color подсказывает WebView/системе цвет окружающей chrome-полосы.
      Max WebApp оборачивает приложение своей панелью (CRM / X / ⋯), и без
      theme-color её фон не совпадает с нашим. Берём --color-background, как
      в Figma `maxToolbar` (bg-[var(--background)]).
    -->
    <meta name="theme-color" content="#17181C" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F2F3F5" media="(prefers-color-scheme: light)" />
    <title>CRM4Max</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap"
    />
    <script>
      // Тема из системных настроек (prefers-color-scheme). Ставим до рендера React —
      // без вспышки — и реагируем на смену системной темы на лету. Fallback — Dark.
      (function () {
        try {
          var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)')
          var apply = function () {
            document.documentElement.dataset.theme = mq && mq.matches ? 'light' : 'dark'
          }
          apply()
          if (mq && mq.addEventListener) mq.addEventListener('change', apply)
        } catch (e) { /* нет matchMedia — остаётся Dark через :root */ }
      })()
    </script>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
