<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="color-scheme" content="light dark" />
    <!--
      theme-color подсказывает WebView/системе цвет окружающей chrome-полосы.
      Max WebApp оборачивает приложение своей панелью (CRM / X / ⋯), и без
      theme-color её фон не совпадает с нашим. Берём --color-background, как
      в Figma `maxToolbar` (bg-[var(--background)]).
    -->
    <meta name="theme-color" content="#0E0F11" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F2F3F5" media="(prefers-color-scheme: light)" />
    <title>CRM4Max</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap"
    />
    <script>
      // Применяем тему до рендера React — без вспышки.
      // Приоритет: localStorage (явный выбор) > prefers-color-scheme (OS) > Dark.
      try {
        var stored = localStorage.getItem('crm4max-theme')
        var t = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        document.documentElement.dataset.theme = t
      } catch (e) { /* приватный режим / нет localStorage */ }
    </script>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
