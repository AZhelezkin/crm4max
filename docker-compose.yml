version: '3.9'

services:
  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://crm4max:crm4max@postgres:5432/crm4max
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      VK_APP_ID: ${VK_APP_ID}
      VK_APP_SECRET: ${VK_APP_SECRET}
      VK_SERVICE_TOKEN: ${VK_SERVICE_TOKEN}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN}
      MAX_BOT_API_URL: ${MAX_BOT_API_URL:-https://botapi.max.ru}
      CRON_SECRET: ${CRON_SECRET:-dev-cron-secret}
      # S3 / MinIO
      S3_REGION: us-east-1
      S3_BUCKET: crm4max-media
      S3_ACCESS_KEY: crm4max
      S3_SECRET_KEY: crm4max123
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000/crm4max-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm4max
      POSTGRES_USER: crm4max
      POSTGRES_PASSWORD: crm4max
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm4max']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── MinIO (S3-совместимое хранилище для разработки) ─────────────────────────
  minio:
    image: minio/minio:latest
    ports:
      - '9000:9000'   # S3 API
      - '9001:9001'   # Web-консоль
    environment:
      MINIO_ROOT_USER: crm4max
      MINIO_ROOT_PASSWORD: crm4max123
    volumes:
      - minio_data:/data
    command: server /data --console-address ':9001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ── MinIO Init (создаёт бакет и делает его публичным) ───────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 crm4max crm4max123 &&
        mc mb --ignore-existing local/crm4max-media &&
        mc anonymous set public local/crm4max-media &&
        echo 'MinIO bucket ready'
      "
    restart: 'no'

volumes:
  postgres_data:
  redis_data:
  minio_data:
