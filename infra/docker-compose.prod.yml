version: '3.9'

# Продакшн-конфиг для Яндекс Облако VM
# PostgreSQL и Redis — Yandex Managed Services (внешние)
# Здесь запускаем только бэкенд

services:
  backend:
    image: cr.yandex/${YC_REGISTRY_ID}/crm4max-backend:${IMAGE_TAG:-latest}
    ports:
      - '3000:3000'
    env_file:
      - .env.prod
    restart: always
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
